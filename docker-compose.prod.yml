services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
      args:
        # Provides a dummy DATABASE_URL for the `prisma generate` build step.
        # prisma generate reads schema.prisma only — no DB connection is made.
        # The real DATABASE_URL is injected at runtime via env_file below.
        DATABASE_URL: "postgresql://build-placeholder:x@localhost:5432/build?schema=public"
    env_file:
      - ./.env.prod
    environment:
      # Backend reads PORT (and optionally API_PORT).
      # NODE_ENV is set here to guarantee production mode even if omitted from .env.prod.
      PORT: 4000
      NODE_ENV: production
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
