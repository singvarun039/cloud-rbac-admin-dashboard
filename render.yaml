services:
  - type: web
    name: rbac-dashboard-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: Render skips devDependencies when NODE_ENV=production is
    # set during the build (see NODE_ENV env var below), which would otherwise
    # break `tsc` (missing typescript, @types/node, @types/express, etc.).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rbac-dashboard-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Generate strong secrets locally with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REFRESH_TOKEN_HASH_SECRET
        sync: false
      # Public URL of the deployed frontend (Render Static Site). Required in
      # production — the backend refuses cross-origin requests without it.
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional — only needed if the AI assistant routes are used.
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: rbac-dashboard-db
    plan: free
    databaseName: rbac_dashboard
    user: rbac_user
