services:
  - type: web
    name: rbac-dashboard-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rbac-dashboard-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Generate strong secrets locally with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REFRESH_TOKEN_HASH_SECRET
        sync: false
      # Public URL of the deployed frontend (Render Static Site). Required in
      # production — the backend refuses cross-origin requests without it.
      - key: FRONTEND_ORIGIN
        sync: false
      # Optional — only needed if the AI assistant routes are used.
      - key: OPENAI_API_KEY
        sync: false

  - type: static
    name: rbac-dashboard-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Public URL of the deployed backend (Render Web Service). Baked into
      # the build at build time — changing it requires a rebuild/redeploy.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback so React Router deep links (e.g. /users) don't 404 on refresh.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rbac-dashboard-db
    plan: free
    databaseName: rbac_dashboard
    user: rbac_user
