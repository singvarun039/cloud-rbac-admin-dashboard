services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crbad}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      # Container listens on 4000; host port is configured via API_PORT mapping below.
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-crbad}?schema=public}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-300000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      # If hot reload is flaky on Windows/WSL mounts, set this to true.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      # Optional: enable Vite debug output (e.g. DEBUG=vite:hmr)
      DEBUG: ${DEBUG:-}
      # Used by vite.config.ts to proxy /api from the dev server to the API service
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api:4000}
      # Optional: if you set this, the browser will call the API directly instead of same-origin+proxy
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      # If hot reload is flaky on Windows/WSL mounts, set this to true.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      # Optional: alternative env name some devs use; also enables polling in vite.config.ts
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    # Container listens on 5173; host port is configured via WEB_PORT mapping above.
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
