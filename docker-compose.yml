services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crbad}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-crbad}?schema=public}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      # If hot reload is flaky on Windows/WSL mounts, set this to true.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      WEB_PORT: ${WEB_PORT:-5173}
      # Used by vite.config.ts to proxy /api from the dev server to the API service
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api:${API_PORT:-4000}}
      # Optional: if you set this, the browser will call the API directly instead of same-origin+proxy
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      # If hot reload is flaky on Windows/WSL mounts, set this to true.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","${WEB_PORT:-5173}"]
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
